name = "esim-subscription"
main = "index.js"
compatibility_date = "2026-10-16"
# The Worker imports the SAME entitlement module the static site uses, so the
# signature format can never drift between the two. That module uses
# node:crypto, which needs this flag.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The premium data endpoints. The FREE pages stay on GitHub Pages - this
# Worker only fronts what needs an entitlement check, so the free experience
# is fast and costs nothing to serve.
routes = [
  { pattern = "esim.youssef-benatti.me/api/*", zone_name = "youssef-benatti.me" }
]

# Entitlement records and the revocation list.
[[kv_namespaces]]
binding = "SUBS"
id = "68b1f69c2499475395f1b361b8718ffd"

# Subscriber accounts (email -> plan -> renewal date).
[[d1_databases]]
binding = "DB"
database_name = "esim_subscribers"
database_id = "42c37877-c3fc-431b-bd46-5842b8ad88fe"

[vars]
COOKIE_NAME = "esim_sub"
SUBSCRIPTION_URL = "https://youssef-benatti.me/esim-arbitrage-calculator/pricing/"

# Secrets (set with `wrangler secret put <NAME>`):
#   SUBSCRIPTION_SECRET  - the HMAC secret used to sign entitlements
#   WEBHOOK_SECRET      - the shared secret the payment provider signs with
