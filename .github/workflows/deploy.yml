name: Build & Deploy

# Every push to main rebuilds the site and publishes it to the gh-pages
# branch. Pull requests run the build and the validation checks only.
#
# The site is published from the gh-pages branch (GitHub Pages "legacy"
# source mode), which is the only branch the github-pages environment
# allows as a deployment target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The build has zero dependencies - it is plain Node with no npm install.
      - name: Build site
        run: node scripts/build.mjs

      - name: Check monetisation & SEO invariants
        run: node scripts/check.mjs

      - name: Validate structure
        run: node scripts/validate.mjs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages publishes from the gh-pages branch, so push the built tree
      # there. This is the same publishing model the local deploy script
      # uses, which keeps CI and local deploys identical.
      - name: Publish to the gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .publish
          persist-credentials: true
          fetch-depth: 1

      - name: Copy the built site over the published branch
        run: |
          set -euo pipefail
          # Replace the published tree with the fresh build.
          find .publish -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R dist/. .publish/
          cd .publish
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet -m "Deploy site (${{ github.sha }})"
            git push origin HEAD:gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
