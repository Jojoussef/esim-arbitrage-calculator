name: Build & Deploy

# Every push to main rebuilds the site and publishes it to the gh-pages
# branch. Pull requests run the build and the validation checks only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The build has zero dependencies - it is plain Node with no npm install.
      - name: Build site
        run: node scripts/build.mjs

      - name: Check monetisation & SEO invariants
        run: node scripts/check.mjs

      - name: Validate structure
        run: node scripts/validate.mjs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
