name: Build & Deploy

# Every push to main rebuilds the site and publishes it to the gh-pages
# branch. Pull requests run the build and the validation checks only.
#
# The site is published from the gh-pages branch (GitHub Pages "legacy"
# source mode), which is the only branch the github-pages environment
# allows as a deployment target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The build has zero dependencies - it is plain Node with no npm install.
      - name: Build site
        run: node scripts/build.mjs

      # The paywall is the only thing standing between the public and the
      # paid data, so its signature scheme gets its own test run. A change
      # to the entitlement format that breaks a signed token must fail CI,
      # not the first paying subscriber.
      - name: Test the entitlement scheme
        run: node scripts/test-entitlement.mjs

      - name: Check monetisation & SEO invariants
        run: node scripts/check.mjs

      - name: Validate structure
        run: node scripts/validate.mjs

      # Warns (does not fail) if the custom domain has drifted away from
      # GitHub Pages - a registrar-level DNS change can break the site
      # without touching this repository at all.
      - name: Check custom domain DNS
        continue-on-error: true
        run: node scripts/check-dns.mjs

      - name: Upload the built site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment: github-pages` here on purpose. That environment is
    # restricted to the gh-pages branch, so a job running from main would be
    # rejected at the environment gate before it even starts. We publish by
    # pushing to the gh-pages branch, which is the same model the local
    # deploy script uses - so CI and local deploys stay identical.
    steps:
      # The build ran in a separate job, so the built site has to be pulled
      # back in from the artifact before it can be published.
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Publish to the gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .publish
          persist-credentials: true
          fetch-depth: 1

      - name: Copy the built site over the published branch
        run: |
          set -euo pipefail
          # Replace the published tree with the fresh build.
          find .publish -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R dist/. .publish/
          cd .publish
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet -m "Deploy site (${{ github.sha }})"
            git push origin HEAD:gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
